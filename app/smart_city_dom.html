<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smart City Demo Snapshot</title>
  <style>
    :root { color-scheme: light; --ink:#173652; --muted:#62788b; --line:#dce7ef; --surface:#ffffff; --page:#eef4f7; --blue:#0872bd; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; background:var(--page); color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",sans-serif; }
    main { width:min(1100px,calc(100% - 32px)); margin:0 auto; padding:32px 0 40px; }
    header { display:flex; align-items:flex-start; justify-content:space-between; gap:20px; margin-bottom:20px; }
    h1 { margin:0; font-size:clamp(1.35rem,3vw,2rem); }
    p { margin:.45rem 0 0; color:var(--muted); line-height:1.6; }
    .status { display:inline-flex; align-items:center; gap:8px; padding:8px 11px; background:#fff4db; border:1px solid #f2cf85; border-radius:999px; color:#795617; font-size:.85rem; white-space:nowrap; }
    .dot { width:8px; height:8px; border-radius:50%; background:#e29d00; }
    .panel { overflow:hidden; background:var(--surface); border:1px solid var(--line); border-radius:16px; box-shadow:0 12px 30px rgba(31,69,95,.09); }
    figure { margin:0; padding:16px; background:#d8e3e6; }
    img { display:block; width:100%; height:auto; border-radius:9px; box-shadow:0 3px 12px rgba(19,47,67,.25); }
    .footer { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px; padding:16px 20px; }
    .footer p { margin:0; font-size:.9rem; }
    a { display:inline-block; padding:10px 14px; border-radius:9px; background:var(--blue); color:white; text-decoration:none; font-weight:650; }
    a:hover { background:#075e9d; }
    @media (max-width:580px) { main { width:min(100% - 24px,1100px); padding-top:20px; } header { flex-direction:column; gap:10px; } figure { padding:8px; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Smart City Digital Twin</h1>
        <p>ภาพตัวอย่างที่บันทึกไว้จากแพลตฟอร์มของ Innovative Village</p>
      </div>
      <div class="status"><span class="dot"></span> Offline snapshot</div>
    </header>
    <section class="panel" aria-label="Smart City demo snapshot">
      <figure><img src="../assets/smart_city_demo.png" alt="Smart City Digital Twin dashboard snapshot"></figure>
      <div class="footer">
        <p>หน้านี้เป็นภาพอ้างอิงในเครื่อง ไม่ใช่สำเนาแบบโต้ตอบของแพลตฟอร์มจริง</p>
        <a href="https://chiangmai-smartcity-twin.espera4u.chatgpt.site/" target="_blank" rel="noopener noreferrer">เปิดแพลตฟอร์มจริง ↗</a>
      </div>
    </section>
  </main>
</body>
</html>
